# Medini CRM Frontend — nginx static SPA config (S10 T2)
# Serves the Vite production build; SPA fallback to index.html.
# /api/* is NOT handled here — the reverse proxy (Caddy) routes /api to backend.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — all routes serve index.html (client-side routing)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Static assets — long cache
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
