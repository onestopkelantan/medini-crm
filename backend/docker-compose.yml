# Development / test orchestration ONLY. Not production.
# PostgreSQL + Redis are provided for local dev; NOT treated as production DB.
services:
  backend:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://medini:medini_dev_password@postgres:5432/medini_dev
      DATABASE_RUNTIME_URL: postgres://medini_app:medini_app_password@postgres:5432/medini_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_only_insecure_jwt_secret_change_me
      JWT_REFRESH_SECRET: dev_only_insecure_refresh_secret_change_me
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medini
      POSTGRES_PASSWORD: medini_dev_password
      POSTGRES_DB: medini_dev
    ports:
      # Tier 2 (T2-F / P7-F1): bind to localhost only — dev DB must NOT be
      # reachable from the LAN. Host 5433 avoids clash with native PG on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # Tier 2 (T2-F / P7-F1): localhost only — dev Redis has no auth; it must
      # never be LAN-reachable. Containers still reach it over the internal
      # bridge network; host access is via 127.0.0.1.
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
