name: backend-ci

on:
  push:
    branches: [main, develop]
    paths: ['backend/**']
  pull_request:
    paths: ['backend/**']

jobs:
  foundation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medini
          POSTGRES_PASSWORD: medini_dev_password
          POSTGRES_DB: medini_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medini -d medini_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://medini:medini_dev_password@localhost:5432/medini_dev
      DATABASE_RUNTIME_URL: postgres://medini_app:medini_app_password@localhost:5432/medini_dev
      JWT_SECRET: ci_only_insecure_jwt_secret_for_tests_0123456789
      JWT_REFRESH_SECRET: ci_only_insecure_refresh_secret_for_tests_0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Migrate (clean PG16 — manual psql apply, surfaces real errors)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          for f in drizzle/0000_schema_foundation.sql drizzle/0002_rls_foundation.sql drizzle/0003_rls_hardening.sql drizzle/0004_patient_timeline.sql drizzle/0005_org_sequences.sql drizzle/0006_payor_master_data.sql; do
            echo "--- applying $f ---"
            sed 's/--> statement-breakpoint//g' "$f" | PGPASSWORD=medini_dev_password psql -h localhost -U medini -d medini_dev -v ON_ERROR_STOP=1 -q
          done
      - name: Seed (14 branches + 4 demo users, Argon2id)
        run: node dist/infrastructure/database/seed.js
      - name: Tests (unit + contract + architecture + live DB integration)
        run: npm test
