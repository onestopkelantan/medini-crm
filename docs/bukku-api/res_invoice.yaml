type: object
properties:
  id:
    type: integer
    example: 1
  payment_mode:
    type: string
    example: credit
  contact_id:
    type: integer
    example: 1
  contact_code:
    type: string
    example: C-A0001
  contact_name:
    type: string
    example: Alex Wong
  number:
    type: string
    example: IV-00231
  number2:
    type: string
    example: KC20001001
  date:
    type: string
    format: date
    example: '2022-02-01'
  currency_code:
    type: string
    example: MYR
  currency_symbol:
    type: string
    example: RM
  exchange_rate:
    type: number
    example: 4.766581
  billing_party:
    type: string
    example: |
      Alex Wong
      10, Jalan Perak,
      Taman Salak Tinggi,
      57200 Kuala Lumpur
  show_shipping:
    type: boolean
    example: true
  shipping_info:
    type: string
    example: GDEX A12345
  shipping_party:
    type: string
    example: |
      Winson Tey
      20, Jalan Hijau,
      Taman Universiti,
      80700 Johor Bahru
  tag_ids:
    type: array
    items:
      type: integer
    example:
      - 1
      - 3
  tag_names:
    type: array
    items:
      type: string
    example:
      - Kuala Lumpur
      - IT
  title:
    type: string
    example: Proposal To Revamp The Server Farm
  description:
    type: string
    example: 3x Intel Server
  remarks:
    type: string
    example: |
      Thank you for your interest in our service.
  tax_mode:
    type: string
    example: exclusive
  form_items:
    $ref: ../form_items_my_invois/res_txn_form_items_my_invois.yaml
  term_items:
    $ref: ../term_items/res_txn_term_items.yaml
  deposit_items:
    $ref: ../deposit_items/res_txn_deposit_items.yaml
  linked_items:
    $ref: ../linked_items/res_txn_linked_items.yaml
  amount:
    type: number
    example: 2000
  balance:
    type: number
    example: 2000
  rounding_on:
    type: boolean
    example: false
  rounding_amount:
    type: number
    example: 0
  status:
    type: string
    example: ready
  type:
    type: string
    example: sale_invoice
  short_link:
    type: string
    example: https://demo.bukku.my/v/123x5
  files:
    $ref: ../files/res_txn_files.yaml
  fields:
    $ref: ../fields/res_fields.yaml
  customs_form_no:
    type: string
    nullable: true
    example: '0912300582846278021'
  customs_k2_form_no:
    type: string
    nullable: true
    example: '091230058284'
  incoterms:
    type: string
    nullable: true
    example: FOB
  myinvois_action:
    type: string
    nullable: true
    example: VALIDATE
  myinvois_document_uuid:
    type: string
    nullable: true
    example: AAA000AAA000AAA000AAA000AA
  myinvois_document_long_id:
    type: string
    nullable: true
    example: LIJAF97HJJKH8298KHADH09908570FDKK9S2LSIUHB377373
  myinvois_document_status:
    type: string
    nullable: true
    example: VALID
  issued_at:
    type: string
    nullable: true
    example: '2024-08-08 00:00:00'
  validated_at:
    type: string
    nullable: true
    example: '2024-08-08 08:08:08'
  rejected_at:
    type: string
    nullable: true
    example: null
  reject_message:
    type: string
    nullable: true
    example: null
  cancelled_at:
    type: string
    nullable: true
    example: null
  cancel_message:
    type: string
    nullable: true
    example: null
