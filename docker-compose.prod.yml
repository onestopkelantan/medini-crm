# ============================================================================
# Medini CRM — PRODUCTION Docker Compose (S10 T2)
#
# Architecture:
#   Internet → Caddy (443/HTTPS) → frontend (static SPA)
#                              ↘ /api/v1 → backend (NestJS)
#                                            ↓
#                                    PostgreSQL (internal) + Redis (internal)
#                                            ↓
#                                    Workers (BullMQ)
#
# PostgreSQL/Redis are NOT exposed to the public internet.
# Backup runs as a sidecar container writing to a persistent volume.
# ============================================================================

name: medini-prod

services:
  # ---- Reverse proxy / HTTPS termination ----
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - medini-public
      - medini-internal

  # ---- Frontend (static SPA via nginx) ----
  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    networks:
      - medini-internal
    # No public port — Caddy proxies to this.

  # ---- Backend (NestJS) ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://medini:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_RUNTIME_URL: postgres://medini_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # S10 F-03 (GLM final audit): Caddy is the only direct peer of the
      # backend, on the Docker bridge network (172.16.0.0/12 covers all
      # Docker bridge subnets). With this set, per-IP rate limiting works
      # through the proxy; unset it stays fail-closed (one shared bucket).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medini-internal
    # No public port — Caddy proxies /api/v1 to this.

  # ---- PostgreSQL 16 (production) ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Runtime role (non-owner, RLS-subject) is created by migrations.
      # Tier 1 (P7-F3): WAL archiving for PITR. archive_command copies each
      # completed WAL segment to the separate `walarchive` volume.
      WAL_ARCHIVE_DIR: /walarchive
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=/wal-archive.sh %p %f
      - -c
      - archive_timeout=300
      - -c
      - max_wal_size=1GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/walarchive
      - ./backup/wal-archive.sh:/wal-archive.sh:ro
    networks:
      - medini-internal
    # NO public port — internal only.
    healthcheck:
      # Liveness = pg_isready. Tier 1: also surface a STALLED WAL archiver as
      # unhealthy (last_failed_wal newer than last_archived_wal) so a broken
      # PITR chain is visible in `docker ps`.
      test:
        - CMD-SHELL
        - >
          pg_isready -U medini -d "$${POSTGRES_DB}" -q &&
          psql -U medini -d "$${POSTGRES_DB}" -tAc
          "SELECT COALESCE(last_failed_wal IS NULL OR last_archived_wal >= last_failed_wal, true) FROM pg_stat_archiver" | grep -q t
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis 7 (queue + cache) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - medini-internal
    # NO public port — internal only.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Backup sidecar (pg_dump every 6h + WAL retention) ----
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: medini
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      WAL_ARCHIVE_DIR: /walarchive
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/wal-retain.sh:/wal-retain.sh:ro
      - backupdata:/backups
      - walarchive:/walarchive
    networks:
      - medini-internal
    # Tier 1 (P7-F3): full backup every 6 hours (RPO floor 6h); WAL retention
    # hourly. Healthcheck = heartbeat file so `docker ps` shows backup liveness
    # (used by the backup-staleness alert / watchdog).
    command: >
      sh -c "
        echo '17 */6 * * * /backup.sh >> /backups/backup.log 2>&1' | crontab - &&
        echo '43 * * * * /wal-retain.sh' | crontab - &&
        ( while true; do touch /backups/.heartbeat; sleep 300; done ) &
        crond -f"
    healthcheck:
      # FAILS if the last successful backup heartbeat is older than 26h,
      # surfacing a broken backup as an unhealthy container.
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /backups/.heartbeat 2>/dev/null || echo 0) )) -lt 93600"]
      interval: 1h
      timeout: 10s
      retries: 3
      start_period: 1h
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================================================
  # MONITORING STACK (Tier 1, P7-F8) — internal only, NO public ports.
  # Architecture per docs/OBSERVABILITY.md (S9 ADR-008). Prometheus scrapes
  # backend /metrics + exporters; Alertmanager routes alerts; Grafana optional.
  # All services attach to medini-internal (no internet egress, no host ports).
  # ==========================================================================

  # ---- Prometheus: metrics TSDB + alert evaluation ----
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheusdata:/prometheus
    networks:
      - medini-internal
    depends_on:
      - backend

  # ---- Alertmanager: alert routing/notification ----
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanagerdata:/alertmanager
    networks:
      - medini-internal

  # ---- Blackbox exporter: HTTP probes (health/readiness/WAHA) ----
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - medini-internal

  # ---- PostgreSQL exporter (uses runtime role, read-only metrics) ----
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://medini:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    networks:
      - medini-internal
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Redis exporter ----
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - medini-internal
    depends_on:
      redis:
        condition: service_healthy

  # ---- node exporter: host disk/CPU/mem + backup/WAL textfile metrics ----
  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - backupdata:/textfile:ro   # reads /textfile/metrics/*.prom written by backup sidecar
    networks:
      - medini-internal

  # ---- cAdvisor: container restart-loop / resource metrics ----
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - medini-internal

  # ---- Grafana: dashboards (optional operator UI, internal only) ----
  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - medini-internal
    depends_on:
      - prometheus

  # ==========================================================================
  # WAHA (WhatsApp transport) — PRODUCTION-READY but DISABLED by default.
  # Uncomment ONLY when WhatsApp is in launch scope AND you have read
  # docs/WAHA-PRODUCTION-READINESS.md. Internal-only (no public port); the
  # backend calls WAHA over medini-internal. Anti-ban (daily cap, 30-60s
  # randomized cooldown, warming) is enforced in the BACKEND worker
  # (whatsapp-lifecycle.ts / whatsapp-transport.worker.ts) — not here.
  #
  # SECURITY: WAHA_API_KEY / dashboard credentials are injected via
  # backend/.env (secret manager) — NEVER commit real values.
  # ==========================================================================
  # waha:
  #   image: devlikeapro/waha:latest
  #   restart: unless-stopped
  #   environment:
  #     # --- Authentication (required) ---
  #     WAHA_API_KEY: ${WAHA_API_KEY}                       # STRONG random key (secret manager)
  #     WAHA_DASHBOARD_ENABLED: "false"                     # no dashboard in prod (reduce surface)
  #     WHATSAPP_SWAGGER_ENABLED: "false"                   # no public swagger in prod
  #     # --- Engine / sessions ---
  #     WHATSAPP_DEFAULT_ENGINE: NOWEB
  #     WAHA_NAMESPACE: all
  #     # --- Logging / privacy ---
  #     WAHA_LOG_FORMAT: JSON
  #     WAHA_LOG_LEVEL: info
  #     WAHA_PRINT_QR: "false"                              # QR via authenticated API only, never logs
  #     # --- Media hygiene (PHI minimisation) ---
  #     WAHA_MEDIA_STORAGE: LOCAL
  #     WHATSAPP_FILES_LIFETIME: 0                          # delete media immediately after fetch
  #     WHATSAPP_FILES_FOLDER: /app/.media
  #     WAHA_BASE_URL: http://waha:3000                     # internal service URL
  #   volumes:
  #     - waha_sessions:/app/.sessions                      # session persistence across restarts
  #   networks:
  #     - medini-internal                                   # NO public port — backend calls internally
  #   healthcheck:
  #     # Liveness = the authenticated sessions endpoint responds (401 without
  #     # a key still proves the process is up; use the key for a true 200).
  #     test: ["CMD-SHELL", "wget -qO- --header='X-Api-Key: ${WAHA_API_KEY}' http://localhost:3000/api/sessions >/dev/null 2>&1 || exit 1"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 20s

networks:
  medini-public:
    driver: bridge
  medini-internal:
    driver: bridge
    internal: true   # no outbound internet — DB/Redis/workers stay private

volumes:
  pgdata:
  redisdata:
  backupdata:
  walarchive:
  prometheusdata:
  alertmanagerdata:
  grafanadata:
  caddy_data:
  caddy_config:
  # waha_sessions:
