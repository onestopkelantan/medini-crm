# ============================================================================
# Medini CRM — Prometheus scrape config (Tier 1, P7-F8 monitoring)
#
# Implements the architecture already specified in docs/OBSERVABILITY.md (S9
# ADR-008 — Prometheus metrics, KISS, no over-engineering). Scrapes the
# backend's existing prom-client /metrics endpoint plus blackbox probes of the
# health/readiness endpoints and WAHA. Internal Docker network only.
# ============================================================================
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ---- Backend application metrics (prom-client) ----
  - job_name: medini-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:3000']
        labels:
          service: medini-backend

  # ---- Infrastructure exporters ----
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # ---- Backend health/readiness via blackbox HTTP probes ----
  - job_name: medini-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:3000/health/live
          - http://backend:3000/health/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ---- WAHA availability/session (when WAHA is in launch scope) ----
  - job_name: waha
    metrics_path: /probe
    params:
      module: [waha]
    static_configs:
      - targets:
          - http://waha:3000/api/sessions
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
